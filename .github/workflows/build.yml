name: Build HFSTOL artifact

on:
  push:
  pull_request:

jobs:
  build-hfstol:
    runs-on: ubuntu-latest
    container:
      image: apertium/base:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate configure script
        run: ./autogen.sh --prefix=/usr

      - name: Configure project
        run: ./configure --prefix=/usr

      - name: Build transducers
        run: make -j"$(nproc)"

      - name: Export HFSTOL artifact
        run: hfst-fst2fst -w -i tat.automorf.hfst -o tat.automorf.hfstol

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tat-automorf-hfstol
          path: tat.automorf.hfstol
          retention-days: 7
